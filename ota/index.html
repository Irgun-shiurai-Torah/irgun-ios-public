<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Install Irgun Shiurai Torah</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#111;margin:0;padding:32px 20px}
    main{max-width:560px;margin:0 auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
    h1{font-size:28px;margin:0 0 10px}.muted{color:#667085;line-height:1.5}.button{display:block;text-align:center;background:#0a66ff;color:#fff;text-decoration:none;font-weight:700;padding:16px 18px;border-radius:14px;margin:24px 0 16px}
    .note{font-size:14px;line-height:1.5;background:#f8fafc;border-radius:12px;padding:14px}
  </style>
</head>
<body>
  <main>
    <h1>Irgun Shiurai Torah</h1>
    <p class="muted">Wireless iPad test build __BUILD_NUMBER__</p>
    <a class="button" href="itms-services://?action=download-manifest&url=https://irgun-shiurai-torah.github.io/irgun-ios-public/manifest.plist">Install on this iPad</a>
    <p class="note">Open this page in Safari on the registered iPad. The iPad UDID must be included in the Ad Hoc provisioning profile. If iPadOS asks for confirmation, choose Install.</p>
  </main>
</body>
</html>
