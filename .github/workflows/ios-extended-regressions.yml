name: iOS Extended Regression Tests

# PR47 is merged. Enable a temporary push trigger ONLY for this staging branch
# so extended iPhone/iPad tests run now. Restore manual-only before merging PR46.
on:
  workflow_dispatch:
  push:
    branches: [test/ios-regressions-pr25-pr26-after-pr45]

permissions:
  actions: read
  contents: read

# Separate accounts let this suite run alongside Login & Account Tests, which
# retains the original shared-account lock. Keep successive extended runs queued;
# each job also takes its account's lock before any server mutations.
concurrency:
  group: ios-extended-regressions-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  device:
    name: Extended ${{ matrix.family }} tests
    runs-on: macos-26
    timeout-minutes: 105
    concurrency:
      group: ios-account-qa-${{ matrix.account }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - family: iPhone
            account: 2
            email_secret: IRGUN_TEST_EMAIL_2
            password_secret: IRGUN_TEST_PASSWORD_2
          - family: iPad
            account: 3
            email_secret: IRGUN_TEST_EMAIL_3
            password_secret: IRGUN_TEST_PASSWORD_3
    env:
      DEVICE_FAMILY: ${{ matrix.family }}
      BUNDLE_ID: org.irgunshiuraitorah.app
      BUILD_NUMBER: '1'
      SIMULATOR_VIDEO_ID: ''
      IRGUN_TEST_EMAIL: ${{ secrets[matrix.email_secret] }}
      IRGUN_TEST_PASSWORD: ${{ secrets[matrix.password_secret] }}
      IRGUN_QA_SLOT: '${{ matrix.account }}'
      IRGUN_SYNC_MARKER: '${{ github.run_id }}${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@v7
      - name: Require distinct dedicated QA accounts
        id: qa-accounts
        env:
          IRGUN_QA_EMAIL_1: ${{ secrets.IRGUN_TEST_EMAIL }}
          IRGUN_QA_EMAIL_2: ${{ secrets.IRGUN_TEST_EMAIL_2 }}
          IRGUN_QA_EMAIL_3: ${{ secrets.IRGUN_TEST_EMAIL_3 }}
        run: python3 .github/regression/validate_accounts.py
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '~26.6.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve current iOS marketing version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version.replace(/-ios$/, '')")"
          test -n "$VERSION"
          echo "IOS_MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build real app and inject test-only observations
        run: bash .github/regression/setup.sh
      - name: Select and boot real simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/regression/select_simulator.py "$DEVICE_FAMILY"
          # $GITHUB_ENV is only imported into *subsequent* steps. Read the
          # selected device directly here before attempting simctl boot.
          UDID="$(python3 -c 'import json,os; print(json.load(open("simulator-results/"+os.environ["DEVICE_FAMILY"]+".json"))["udid"])')"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Start packet-filter network outage gate
        run: |
          mkdir -p simulator-results
          python3 -u .github/regression/network_gate.py > simulator-results/network-gate.log 2>&1 &
          echo $! > simulator-results/network-gate.pid
          python3 - <<'PY'
          import socket,time
          for _ in range(70):
              try:
                  with socket.create_connection(('127.0.0.1',47311),timeout=.4):
                      print('Real PF network gate ready')
                      break
              except OSError:time.sleep(.25)
          else:raise SystemExit('Packet-filter network gate did not start')
          PY
      - name: Run true UI controls, network, offline and account edge cases
        shell: bash
        run: |
          if [ "$DEVICE_FAMILY" = iPhone ]; then UDID="$IPHONE_UDID"; else UDID="$IPAD_UDID"; fi
          bash .github/regression/run_ui.sh core "$UDID"
      - name: Send simulator push through SpringBoard and require native tap
        if: ${{ always() && steps.qa-accounts.outcome == 'success' }}
        shell: bash
        run: |
          if [ "$DEVICE_FAMILY" = iPhone ]; then UDID="$IPHONE_UDID"; else UDID="$IPAD_UDID"; fi
          bash .github/regression/run_ui.sh push "$UDID"
      - name: Always restore PF and save XCTest summaries
        if: always()
        run: |
          mkdir -p simulator-results
          python3 - <<'PY'
          import socket
          try:
              with socket.create_connection(('127.0.0.1',47311),timeout=3) as s:
                  s.sendall(b'UP\n')
                  print(s.recv(100).decode(errors='replace'))
          except OSError as e:print('network gate cleanup:',str(e))
          PY
          if [ -f simulator-results/network-gate.pid ]; then
            kill "$(cat simulator-results/network-gate.pid)" 2>/dev/null || true
          fi
          for result in Regression Push; do
            if [ -d "simulator-results/$result.xcresult" ]; then
              xcrun xcresulttool get test-results summary --path "simulator-results/$result.xcresult" > "simulator-results/$result-summary.json" || true
            fi
          done
          if [ "$DEVICE_FAMILY" = iPhone ]; then UDID="$IPHONE_UDID"; else UDID="$IPAD_UDID"; fi
          if [ -n "$UDID" ]; then xcrun simctl shutdown "$UDID" || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extended-${{ matrix.family }}-${{ github.run_id }}
          path: |
            simulator-results/*summary.json
            simulator-results/*xcodebuild.log
            simulator-results/network-gate.log
            simulator-results/push-sender.log
          retention-days: 7
          if-no-files-found: warn

  cross-device:
    name: iPhone account mutation to independently signed-in iPad
    if: ${{ always() && !cancelled() }}
    needs: device
    runs-on: macos-26
    timeout-minutes: 90
    # Hold slot 2 throughout writer, independent reader and cleanup. A future
    # run cannot change this account between the two devices' observations.
    concurrency:
      group: ios-account-qa-2
      queue: max
      cancel-in-progress: false
    env:
      BUNDLE_ID: org.irgunshiuraitorah.app
      BUILD_NUMBER: '1'
      SIMULATOR_VIDEO_ID: ''
      IRGUN_TEST_EMAIL: ${{ secrets.IRGUN_TEST_EMAIL_2 }}
      IRGUN_TEST_PASSWORD: ${{ secrets.IRGUN_TEST_PASSWORD_2 }}
      IRGUN_QA_SLOT: '2'
      IRGUN_SYNC_MARKER: '${{ github.run_id }}${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@v7
      - name: Require distinct dedicated QA accounts
        id: qa-accounts
        env:
          IRGUN_QA_EMAIL_1: ${{ secrets.IRGUN_TEST_EMAIL }}
          IRGUN_QA_EMAIL_2: ${{ secrets.IRGUN_TEST_EMAIL_2 }}
          IRGUN_QA_EMAIL_3: ${{ secrets.IRGUN_TEST_EMAIL_3 }}
        run: python3 .github/regression/validate_accounts.py
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '~26.6.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve current iOS marketing version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version.replace(/-ios$/, '')")"
          test -n "$VERSION"
          echo "IOS_MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build real app with authenticated regression observers
        run: bash .github/regression/setup.sh
      - name: Sign in on iPhone and write real Like, Follow and playlist
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/regression/select_simulator.py iPhone
          python3 .github/regression/select_simulator.py iPad
          IPHONE_UDID="$(python3 -c 'import json; print(json.load(open("simulator-results/iPhone.json"))["udid"])')"
          xcrun simctl boot "$IPHONE_UDID"
          xcrun simctl bootstatus "$IPHONE_UDID" -b
          bash .github/regression/run_ui.sh writer "$IPHONE_UDID"
          xcrun simctl shutdown "$IPHONE_UDID"
      - name: Sign in separately on iPad and verify server-loaded changes
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$IPAD_UDID"
          xcrun simctl bootstatus "$IPAD_UDID" -b
          bash .github/regression/run_ui.sh reader "$IPAD_UDID"
      - name: Collect cross-device XCTest evidence
        if: always()
        run: |
          mkdir -p simulator-results
          for result in CrossDeviceWriter CrossDeviceReader; do
            if [ -d "simulator-results/$result.xcresult" ]; then
              xcrun xcresulttool get test-results summary --path "simulator-results/$result.xcresult" > "simulator-results/$result-summary.json" || true
            fi
          done
          for UDID in "${IPHONE_UDID:-}" "${IPAD_UDID:-}"; do
            if [ -n "$UDID" ]; then xcrun simctl shutdown "$UDID" || true; fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-device-${{ github.run_id }}
          path: |
            simulator-results/*summary.json
            simulator-results/*xcodebuild.log
          retention-days: 7
          if-no-files-found: warn

