name: iOS Native AVPlayer HLS Tests

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Verified Irgun shiur ID with video and audio HLS (optional)
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/ios-native-player.yml
      - .github/simulator/**
      - package.json
      - scripts/IrgunUnifiedPlayerPlugin.swift
      - scripts/test_ios_unified_avplayer.mjs
      - scripts/test_ios_vimeo_background.mjs
      - scripts/test_ios_follow_controls.mjs
      - src/follow-controls.js
      - scripts/prepare_ios_cloud.py
      - scripts/patch_xcode_project.rb
      - src/ios-native-avplayer.js
      - src/main.js

permissions:
  contents: read

concurrency:
  group: ios-native-avplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playback:
    name: Real native AVPlayer on ${{ matrix.family }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    env:
      BUNDLE_ID: org.irgunshiuraitorah.app
      BUILD_NUMBER: "1"
      SIMULATOR_VIDEO_ID: ${{ inputs.video_id || '' }}
      DEVICE_FAMILY: ${{ matrix.family }}

    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.6.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Resolve iOS marketing version from package.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version.replace(/-ios$/, '')")"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve iOS marketing version from package.json" >&2
            exit 2
          fi
          echo "IOS_MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved iOS marketing version: $VERSION"

      - name: Install dependencies and add simulator-only observations
        run: |
          node --test scripts/test_ios_playback.cjs scripts/test_tab_swipes.cjs
          node --test scripts/test_ios_unified_avplayer.mjs scripts/test_ios_vimeo_background.mjs scripts/test_ios_follow_controls.mjs
          node --check src/main.js
          node scripts/test_ios_reader_mode.mjs
          node --test scripts/test_ios_android_parity.mjs scripts/test_ios_collection_parity.mjs scripts/test_ios_swipe_motion.mjs scripts/test_ios_sample_selection.mjs
          npm install --no-audit --no-fund
          python3 .github/simulator/prepare.py web
          npm run build
          npx cap add ios
          npx cap sync ios
          npx @capacitor/assets generate --ios
          python3 scripts/prepare_ios_cloud.py
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --no-document
          ruby scripts/patch_xcode_project.rb
          python3 .github/simulator/prepare.py native
          ruby .github/simulator/configure.rb
          bash scripts/assert_no_direct_swiftuicore.sh

      - name: Install CocoaPods dependencies if used
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install --repo-update
          fi

      - name: Select and boot an installed simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p simulator-results
          xcodebuild -version > simulator-results/xcode-version.txt
          xcrun simctl list devices available --json > simulator-results/devices.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          devices = json.loads(Path('simulator-results/devices.json').read_text())['devices']
          candidates = [(runtime, device) for runtime, group in devices.items()
                        if '.iOS-' in runtime for device in group
                        if device.get('isAvailable') and device['name'].startswith(os.environ['DEVICE_FAMILY'])]
          if not candidates:
              raise SystemExit('No installed simulator for ' + os.environ['DEVICE_FAMILY'])
          def preferred(item):
              name=item[1]['name']
              match=('Pro Max' in name) if os.environ['DEVICE_FAMILY']=='iPhone' else ('Pro' in name and '13' in name)
              return (tuple(map(int,re.findall(r'\d+',item[0]))),match,tuple(map(int,re.findall(r'\d+',name))))
          candidates.sort(key=preferred, reverse=True)
          runtime, device = candidates[0]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_UDID=' + device['udid'] + '\n')
          Path('simulator-results/selected-device.json').write_text(json.dumps({'runtime':runtime, **device}, indent=2))
          print('Selected', device['name'], runtime, device['udid'])
          PY

      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time "9:41" --batteryState charged --batteryLevel 100

      - name: Run real native AVPlayer HLS and Home UI test
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER=(-project ios/App/App.xcodeproj)
          if [ -d ios/App/App.xcworkspace ]; then
            CONTAINER=(-workspace ios/App/App.xcworkspace)
          fi
          xcodebuild "${CONTAINER[@]}" \
            -scheme SimulatorPlayback \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/SimulatorDerivedData" \
            -resultBundlePath simulator-results/Playback.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SimulatorUITests/PlaybackUITests/testNativeSingleAVPlayerVideoAudioMiniHome \
            test 2>&1 | tee simulator-results/xcodebuild.log

      - name: Collect screenshots and simulator logs
        if: always()
        shell: bash
        run: |
          mkdir -p simulator-results/attachments
          if [ -d simulator-results/Playback.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path simulator-results/Playback.xcresult \
              --output-path simulator-results/attachments || true
            xcrun xcresulttool get test-results summary \
              --path simulator-results/Playback.xcresult \
              > simulator-results/test-summary.json || true
          fi
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl io "$SIMULATOR_UDID" screenshot simulator-results/final-screen.png || true
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 20m --style compact \
              --predicate 'process == "IrgunShiuraiTorah" OR process == "SimulatorUITests-Runner"' \
              > simulator-results/simulator.log 2>&1 || true
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Upload screenshots, playback observations and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-avplayer-${{ matrix.family }}-${{ github.run_number }}
          path: simulator-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Explain native test status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## Native AVPlayer HLS on ${{ matrix.family }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **$JOB_STATUS**" >> "$GITHUB_STEP_SUMMARY"
          echo "Real assertions: single AVPlayer item ID, native HLS readiness and video size, advancing clock, Audio/Video switching, native seek and pause, Home/reopen, mini player. This run does not attest to physical-device PiP or offline HLS." >> "$GITHUB_STEP_SUMMARY"
